name: PetClinic API tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  functional:
    runs-on: ubuntu-latest
    services:
      petclinic:
        image: springcommunity/spring-petclinic-rest:4.0.2
        ports:
          - 9966:9966
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for PetClinic
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:9966/petclinic/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: Run smoke and regression coverage in parallel
        run: ./mvnw --batch-mode clean test -Dkarate.threads=4
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: |
            target/karate-reports
            target/surefire-reports

  performance:
    runs-on: ubuntu-latest
    needs: functional
    services:
      petclinic:
        image: springcommunity/spring-petclinic-rest:4.0.2
        ports:
          - 9966:9966
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for PetClinic
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:9966/petclinic/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: Run the read-only performance gate
        run: ./mvnw --batch-mode test-compile gatling:test
      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: target/gatling
